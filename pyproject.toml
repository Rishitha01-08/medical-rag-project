[project]
name = "educational-medical-rag"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3", "httpx>=0.27,<1"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --cov=app --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"] # Long API descriptions and fixed safety prompts are reviewed text.

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
