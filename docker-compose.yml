services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MOCK_MODE: "true"
      APP_ENV: development
      LOG_LEVEL: INFO
      INGESTION_API_KEY: ${INGESTION_API_KEY:-}
    volumes:
      - medical-rag-data:/app/data/local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  medical-rag-data:
