services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-mock-evidence-v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      VECTOR_COLLECTION: ${VECTOR_COLLECTION:-medical_docs}
      INGESTION_API_KEY: ${INGESTION_API_KEY:-}
      DATABASE_PATH: /app/data/local/medguide.sqlite3
      DATABASE_URL: ${DATABASE_URL:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
    volumes:
      - ./data/local:/app/data/local
      - ./data/raw/hack-a-cure:/app/data/raw/hack-a-cure:ro
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  qdrant-storage:
